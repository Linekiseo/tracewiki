    expected_target_keys: [controlled_calculate_total]
    validation_target_keys: []
    forbidden_target_keys: []
    required_path_keys: []
    expected_context_roles: [primary]
    expected_answer_mode: direct
    answerability: answerable
    candidate_judgments:
      - {target_key: controlled_calculate_total, relevance_grade: 2, necessity_role: required, note: 实际总价入口}
      - {target_key: controlled_tax_format_line, relevance_grade: -1, necessity_role: hard_negative, note: 同名格式化函数不是总价入口}
