schema_version: code-golden-cases-v2
dataset_id: code-golden
dataset_version: code-golden-v2

profiles:
  controlled: &controlled
    repository_id: repo://fixtures.invalid/code-golden/controlled-multilingual
    ref_key: controlled_main
    acl_refs: [acl://code-golden-v2/public]
  project: &project
    repository_id: repo://fixtures.invalid/code-golden/current-project-snapshot
    ref_key: project_fixed_head
    acl_refs: [acl://code-golden-v2/public]
  history_dirty: &history_dirty
    repository_id: repo://fixtures.invalid/code-golden/historical-error
    ref_key: history_dirty
    acl_refs: [acl://code-golden-v2/public]
  history_release: &history_release
    repository_id: repo://fixtures.invalid/code-golden/historical-error
    ref_key: history_release_branch
    acl_refs: [acl://code-golden-v2/public]
  history_initial: &history_initial
    repository_id: repo://fixtures.invalid/code-golden/historical-error
    ref_key: history_initial
    acl_refs: [acl://code-golden-v2/public]
  history_main: &history_main
    repository_id: repo://fixtures.invalid/code-golden/historical-error
    ref_key: history_main
    acl_refs: [acl://code-golden-v2/public]

eligibility:
  active: &active
    status: eligible
    reason:
  historical: &historical
    status: ineligible
    reason: >-
      C0-01 stores only the active CodeSymbol generation; the validator verifies this
      historical target through CodeHistoryService.read_file, but C0-03 must not put
      it in a retrieval-treatment denominator until historical symbol retrieval exists.
  validation: &validation
    status: ineligible
    reason: >-
      C0-01 ingestion does not consume repository validation artifacts and TestResult
      IDs are generated at record time; the materializer executes the stable target,
      but C0-03 must keep this case out of treatment denominators for now.

