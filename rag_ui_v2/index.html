<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>多源研发证据 RAG · UI Prototype</title>
<style>
:root{

}
*{box-sizing:border-box}

button,input,select{font:inherit}
.app{height:100vh;min-width:1200px;display:grid;grid-template-columns:216px 1fr;grid-template-rows:64px 1fr;overflow:hidden}
.sidebar{grid-row:1/3;background:linear-gradient(180deg,var(--nav),#0a1428);color:#dbe7ff;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.06)}
.brand{height:64px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.08);font-weight:800;font-size:16px;letter-spacing:.2px}
.brand-mark{width:30px;height:30px;margin-right:10px;position:relative}.brand-mark i{position:absolute;width:7px;height:7px;border-radius:50%;background:#60a5fa}.brand-mark i:nth-child(1){left:2px;top:12px}.brand-mark i:nth-child(2){left:12px;top:2px}.brand-mark i:nth-child(3){right:2px;top:12px}.brand-mark i:nth-child(4){left:12px;bottom:2px}.brand-mark:before,.brand-mark:after{content:"";position:absolute;left:6px;top:14px;width:18px;height:2px;background:#38bdf8;transform:rotate(45deg);transform-origin:center}.brand-mark:after{transform:rotate(-45deg)}
.nav{padding:14px 10px;overflow:auto}.nav-group-title{padding:14px 10px 6px;color:#7690bd;font-size:11px;text-transform:uppercase;letter-spacing:.7px}.nav-item{height:40px;display:flex;align-items:center;gap:11px;padding:0 11px;border-radius:9px;color:#c7d7f5;text-decoration:none;cursor:pointer;margin:2px 0;transition:.15s}.nav-item:hover{background:rgba(255,255,255,.06)}.nav-item.active{background:linear-gradient(90deg,#184b98,#143a75);color:white;box-shadow:inset 3px 0 #60a5fa}.nav-icon{width:20px;height:20px;display:grid;place-items:center;border-radius:6px;background:rgba(255,255,255,.06);font-size:11px;font-weight:700}.nav-item.active .nav-icon{background:rgba(255,255,255,.13)}
.sidebar-footer{margin-top:auto;padding:12px}.userbox{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(255,255,255,.04)}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#60a5fa,#7c3aed);color:#fff;font-weight:800}.userbox small{color:#7f97bd}
.topbar{grid-column:2;height:64px;background:rgba(255,255,255,.97);display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--border);gap:16px;z-index:3}
.project-switch{display:flex;align-items:center;gap:9px;border:1px solid var(--border);padding:9px 12px;border-radius:10px;background:#fff;min-width:185px}.project-dot{width:9px;height:9px;border-radius:50%;background:var(--green)}
.global-search{flex:1;max-width:620px;margin:auto;position:relative}.global-search input{width:100%;height:38px;border:1px solid var(--border);border-radius:11px;padding:0 45px 0 38px;background:#f8fafc;color:var(--text);outline:none}.global-search:before{content:"⌕";position:absolute;left:13px;top:7px;font-size:20px;color:var(--muted)}.kbd{position:absolute;right:9px;top:8px;border:1px solid var(--border);border-radius:6px;padding:3px 7px;background:#fff;color:var(--muted);font-size:11px}
.top-actions{display:flex;align-items:center;gap:10px}.icon-btn{width:36px;height:36px;border:1px solid var(--border);border-radius:10px;background:#fff;display:grid;place-items:center;cursor:pointer;position:relative}.notify{position:absolute;right:-3px;top:-5px;background:var(--red);color:#fff;font-size:9px;padding:2px 5px;border-radius:12px}.top-user{display:flex;align-items:center;gap:8px;padding-left:4px}.top-user .avatar{width:30px;height:30px}
.main{grid-column:2;overflow:auto;padding:18px 20px 28px;background:var(--bg)}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:15px}.page-title{font-size:22px;font-weight:800;margin:0 0 5px}.page-sub{color:var(--muted);font-size:12px}.actions{display:flex;gap:9px;align-items:center}.btn{height:36px;padding:0 14px;border:1px solid var(--border);background:#fff;border-radius:9px;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-weight:600}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.success{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{background:#fff;border-color:#fecaca;color:#dc2626}.btn.ghost{background:transparent}.btn.sm{height:30px;padding:0 10px;font-size:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}.card-head{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid var(--border)}.card-title{font-weight:800}.card-sub{color:var(--muted);font-size:11px}.card-body{padding:15px}.flat{box-shadow:none}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi{padding:14px 15px;min-height:100px;position:relative;overflow:hidden}.kpi-label{color:var(--muted);font-size:12px;margin-bottom:9px}.kpi-value{font-size:27px;font-weight:800;letter-spacing:-.5px}.kpi-delta{font-size:11px;margin-top:6px;color:var(--green)}.kpi-icon{position:absolute;right:13px;top:13px;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800}.kpi .spark{position:absolute;right:12px;bottom:11px;width:95px;height:28px}
.chip,.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700;white-space:nowrap}.chip{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}.badge.blue{background:var(--blue-2);color:#1d4ed8}.badge.green{background:var(--green-2);color:#047857}.badge.purple{background:var(--purple-2);color:#6d28d9}.badge.orange{background:var(--orange-2);color:#b45309}.badge.red{background:var(--red-2);color:#b91c1c}.badge.teal{background:var(--teal-2);color:#0f766e}
.table{width:100%;border-collapse:collapse}.table th{font-size:11px;color:var(--muted);font-weight:700;text-align:left;padding:10px 9px;background:#f8fafc;border-bottom:1px solid var(--border)}.table td{padding:10px 9px;border-bottom:1px solid #eef2f7;vertical-align:middle}.table tr:last-child td{border-bottom:0}.table tr.selected td{background:#eff6ff}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:11px}.link{color:var(--blue);font-weight:600;cursor:pointer}.muted{color:var(--muted)}.strong{font-weight:800}.small{font-size:11px}.tiny{font-size:10px}.divider{height:1px;background:var(--border);margin:12px 0}
.tabs{display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--border);height:44px;padding:0 14px}.tab{height:44px;display:flex;align-items:center;color:var(--muted);font-weight:700;border-bottom:2px solid transparent;cursor:pointer}.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.section-title{font-size:14px;font-weight:800;margin:0 0 10px}.subtle-box{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:12px}.colored-box{border-radius:11px;padding:12px;border:1px solid}.colored-box.blue{background:#f4f8ff;border-color:#bfdbfe}.colored-box.green{background:#f2fbf7;border-color:#bbf7d0}.colored-box.purple{background:#faf7ff;border-color:#ddd6fe}.colored-box.orange{background:#fffaf0;border-color:#fed7aa}.colored-box.red{background:#fff7f7;border-color:#fecaca}
.progress{height:7px;background:#e8eef6;border-radius:10px;overflow:hidden}.progress > i{display:block;height:100%;border-radius:10px;background:var(--blue)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.dot.green{background:var(--green)}.dot.blue{background:var(--blue)}.dot.orange{background:var(--orange)}.dot.red{background:var(--red)}.dot.purple{background:var(--purple)}
.list{display:flex;flex-direction:column}.list-item{padding:11px 12px;border-bottom:1px solid #edf1f6;display:flex;gap:10px;align-items:flex-start}.list-item:last-child{border-bottom:0}.list-item.selected{background:#eff6ff;box-shadow:inset 3px 0 var(--blue)}
.domain-icon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:11px;flex:0 0 auto}.domain-icon.session{background:var(--blue-2);color:var(--blue)}.domain-icon.code{background:var(--green-2);color:#059669}.domain-icon.exp{background:var(--purple-2);color:var(--purple)}.domain-icon.doc{background:var(--orange-2);color:#d97706}.domain-icon.claim{background:var(--red-2);color:var(--red)}.domain-icon.graph{background:var(--teal-2);color:var(--teal)}
.metric-bar{display:flex;height:8px;border-radius:8px;overflow:hidden;background:#e2e8f0}.metric-bar span{height:100%}
.svg-chart{width:100%;height:100%}.chart-grid line{stroke:#e8edf4;stroke-width:1}.axis-label{font-size:9px;fill:#94a3b8}.line-blue{stroke:#2563eb;fill:none;stroke-width:2.4}.line-green{stroke:#10b981;fill:none;stroke-width:2.4}.line-purple{stroke:#7c3aed;fill:none;stroke-width:2.4}.line-orange{stroke:#f59e0b;fill:none;stroke-width:2.4}.area-blue{fill:url(#areaBlue)}
.split{display:grid;grid-template-columns:280px minmax(0,1fr);gap:12px}.split-right{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px}.three-pane{display:grid;grid-template-columns:280px minmax(0,1fr) 320px;gap:12px}.four-domain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.domain-card{min-height:236px}.domain-card .card-head{border-bottom:0;height:auto;padding:13px 13px 4px}.domain-card .card-body{padding-top:8px}.domain-card.session{border-top:3px solid var(--blue)}.domain-card.code{border-top:3px solid var(--green)}.domain-card.exp{border-top:3px solid var(--purple)}.domain-card.doc{border-top:3px solid var(--orange)}
.flow{display:flex;align-items:center;gap:7px;overflow:hidden}.flow-node{min-width:124px;flex:1;border:1px solid var(--border);background:#fff;border-radius:10px;padding:10px}.flow-arrow{color:#94a3b8;font-size:17px}.flow-node.blue{background:#f7faff;border-color:#bfdbfe}.flow-node.green{background:#f5fcf8;border-color:#bbf7d0}.flow-node.purple{background:#faf7ff;border-color:#ddd6fe}.flow-node.orange{background:#fffaf2;border-color:#fed7aa}.flow-node.red{background:#fff7f7;border-color:#fecaca}
.timeline{position:relative;padding-left:24px}.timeline:before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:#dbe4ef}.tl-item{position:relative;padding:0 0 17px 14px}.tl-item:before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:#fff;border:3px solid var(--blue)}.tl-item.green:before{border-color:var(--green)}.tl-item.purple:before{border-color:var(--purple)}.tl-item.orange:before{border-color:var(--orange)}.tl-item.red:before{border-color:var(--red)}
.code{background:#0b1220;color:#dbeafe;border-radius:10px;padding:13px;font-family:"SFMono-Regular",Consolas,monospace;font-size:11px;line-height:1.65;overflow:hidden}.code .ln{display:inline-block;width:28px;color:#526581}.code .kw{color:#93c5fd}.code .fn{color:#c4b5fd}.code .str{color:#86efac}.code .del{background:rgba(239,68,68,.16);display:block;margin:0 -13px;padding:0 13px;color:#fecaca}.code .add{background:rgba(16,185,129,.16);display:block;margin:0 -13px;padding:0 13px;color:#bbf7d0}.code.light{background:#fbfdff;color:#334155;border:1px solid var(--border)}.code.light .ln{color:#94a3b8}.code.light .kw{color:#1d4ed8}.code.light .fn{color:#7c3aed}.code.light .str{color:#059669}.code.light .del{background:#fff1f2;color:#9f1239}.code.light .add{background:#ecfdf5;color:#047857}
.filetree{padding:6px 0}.tree-row{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:7px;color:#475569}.tree-row.active{background:#eaf2ff;color:#1d4ed8;font-weight:700}.indent-1{padding-left:24px}.indent-2{padding-left:40px}.indent-3{padding-left:56px}
.node-canvas{position:relative;height:440px;background-image:radial-gradient(#dbe4ef 1px,transparent 1px);background-size:20px 20px;border-radius:12px;overflow:hidden}.graph-node{position:absolute;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;text-align:center;background:#fff;border:3px solid var(--blue);box-shadow:0 8px 24px rgba(15,23,42,.10);font-size:10px;font-weight:800}.graph-node.smalln{width:60px;height:60px}.graph-node.code{border-color:var(--green);background:#f5fff9;color:#065f46}.graph-node.session{border-color:var(--blue);background:#f4f8ff;color:#1e40af}.graph-node.exp{border-color:var(--purple);background:#faf7ff;color:#5b21b6}.graph-node.doc{border-color:var(--orange);background:#fffaf0;color:#92400e}.graph-node.claim{border-color:var(--red);background:#fff7f7;color:#991b1b}.graph-node.method{border-color:var(--teal);background:#f0fdfa;color:#115e59}.graph-edge{position:absolute;height:2px;background:#94a3b8;transform-origin:left center}.graph-edge:after{content:"";position:absolute;right:-1px;top:-4px;border-left:7px solid #94a3b8;border-top:5px solid transparent;border-bottom:5px solid transparent}.edge-label{position:absolute;font-size:9px;color:#64748b;background:#fff;padding:2px 5px;border-radius:5px}
.paper{background:#fff;border:1px solid var(--border);box-shadow:0 8px 30px rgba(15,23,42,.06);border-radius:5px;padding:26px 34px;line-height:1.75}.paper h2{font-size:18px}.paper h3{font-size:14px}.paper p{color:#334155}.paper-table{width:100%;border-collapse:collapse;margin:12px 0}.paper-table th,.paper-table td{border:1px solid #cbd5e1;padding:7px 9px;text-align:center}.paper-table tr.hl td{background:#ecfdf5}.anchor{display:inline-flex;padding:1px 5px;border-radius:5px;background:#eff6ff;color:#1d4ed8;font-size:10px;font-weight:700;margin-left:4px}.claim-highlight{background:#fffbeb;border-left:3px solid var(--orange);padding:7px 10px;border-radius:5px}
.risk-gauge{width:120px;height:65px;position:relative;overflow:hidden;margin:auto}.risk-gauge:before{content:"";position:absolute;width:110px;height:110px;left:5px;top:5px;border-radius:50%;border:14px solid #e2e8f0;border-bottom-color:var(--orange);border-right-color:var(--orange);transform:rotate(45deg)}.risk-gauge span{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:23px;font-weight:800}
.waterfall{display:flex;align-items:center;gap:8px}.wf-stage{border-radius:9px;padding:10px 12px;min-width:130px;border:1px solid var(--border);background:#fff}.wf-time{float:right;color:var(--muted);font-size:10px}
.notice{border-radius:11px;padding:11px 13px;display:flex;align-items:flex-start;gap:10px}.notice.warn{background:#fff8eb;border:1px solid #fed7aa;color:#92400e}.notice.danger{background:#fff5f5;border:1px solid #fecaca;color:#991b1b}.notice.info{background:#f5f9ff;border:1px solid #bfdbfe;color:#1e40af}.notice.success{background:#f2fbf6;border:1px solid #bbf7d0;color:#065f46}
.stat-pair{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #e2e8f0}.stat-pair:last-child{border-bottom:0}
.matrix{display:grid;grid-template-columns:140px repeat(5,1fr);font-size:10px;border:1px solid var(--border);border-radius:10px;overflow:hidden}.matrix > div{padding:8px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);text-align:center}.matrix > div:nth-child(6n+1){text-align:left;font-weight:700;background:#f8fafc}.matrix > div:nth-last-child(-n+6){border-bottom:0}.cell-good{background:#dcfce7}.cell-mid{background:#fef3c7}.cell-bad{background:#fee2e2}
.footer-note{margin-top:14px;color:#94a3b8;text-align:right;font-size:10px}
@media(max-width:1280px){.app{min-width:1100px;grid-template-columns:200px 1fr}.main{padding:14px}.g6{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark"><i></i><i></i><i></i><i></i></span>多源研发证据 RAG</div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-footer"><div class="userbox"><div class="avatar">张</div><div><div class="strong">张伟</div><small>研究工程负责人</small></div></div></div>
  </aside>
  <header class="topbar">
    <div class="project-switch"><span style="color:#2563eb">▣</span><b>RAG Core</b><span class="project-dot"></span><span style="margin-left:auto;color:#64748b">⌄</span></div>
    <div class="global-search"><input value="" placeholder="全局搜索（研究主题 / 会话 / 代码 / Run / 文档 / Claim）"/><span class="kbd">⌘ K</span></div>
    <div class="top-actions"><button class="icon-btn">◔<span class="notify">12</span></button><button class="icon-btn">?</button><div class="top-user"><div class="avatar">张</div><b>张伟</b><span class="muted">⌄</span></div></div>
  </header>
  <main class="main" id="page"></main>
</div>
<script>
const P = window.PAGE_OVERRIDE || new URLSearchParams(location.search).get('page') || 'dashboard';
const navGroups = [
  ['研究协同',[
    ['dashboard','⌂','工作台'],['research','研','研究主题'],['iteration','迭','研究迭代'],['search','⌕','全局检索'],['evidence','链','证据链'],['graph','图','关联图谱']]],
  ['研发资产',[
    ['sessions','会','Codex 会话'],['repo','码','代码仓库'],['changeset','改','代码变更'],['experiments','验','实验中心'],['documents','文','科研文档'],['claim','证','Claim 验证'],['drift','漂','版本漂移']]],
  ['平台管理',[
    ['bindings','绑','绑定复核'],['ingestion','入','数据接入'],['evaluation','评','评测与观测'],['audit','权','权限审计'],['settings','设','项目设置']]]
];
function nav(){let s='';for(const [g,items] of navGroups){s+=`<div class="nav-group-title">${g}</div>`;for(const [id,ic,label] of items)s+=`<a class="nav-item ${P===id||((P==='session-detail')&&id==='sessions')||((P==='run-compare')&&id==='experiments')?'active':''}" data-page="${id}"><span class="nav-icon">${ic}</span>${label}</a>`;}return s}
document.querySelector('#nav').innerHTML=nav();document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>location.href='?page='+x.dataset.page);
const badge=(t,c='blue')=>`<span class="badge ${c}">${t}</span>`;
const chip=(t)=>`<span class="chip">${t}</span>`;
const btn=(t,c='')=>`<button class="btn ${c}">${t}</button>`;
function spark(color='#2563eb',pts='2,23 15,19 28,22 41,12 54,17 67,9 80,13 93,5'){return `<svg class="spark" viewBox="0 0 95 28"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/><circle cx="93" cy="5" r="2.5" fill="${color}"/></svg>`}
