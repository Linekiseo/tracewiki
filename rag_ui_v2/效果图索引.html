<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多源研发证据 RAG · UI 效果图</title><style>body{margin:0;background:#f4f7fb;font-family:Arial,'Microsoft YaHei',sans-serif;color:#0f172a}.head{position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);padding:20px 28px;border-bottom:1px solid #e2e8f0;z-index:2}.head h1{margin:0 0 5px;font-size:24px}.head p{margin:0;color:#64748b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding:22px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(15,23,42,.06)}.card img{display:block;width:100%;height:auto}.cap{padding:12px 15px;display:flex;justify-content:space-between;align-items:center}.cap b{font-size:14px}.cap a{color:#2563eb;text-decoration:none;font-size:12px}@media(max-width:1000px){.grid{grid-template-columns:1fr}}</style></head><body><div class="head"><h1>多源研发证据 RAG · 独立界面效果图</h1><p>20 个桌面端核心界面，统一 1800 × 1125 画布。</p></div><div class="grid" id="g"></div><script>const files=['01_项目工作台','02_研究主题','03_研究迭代联动工作台','04_全局检索','05_证据链详情','06_关联图谱','07_Codex会话列表','08_Codex会话详情','09_代码仓库浏览器','10_代码变更与绑定','11_实验中心','12_实验对照详情','13_科研文档与Claim','14_Claim验证','15_版本漂移分析','16_Binding复核中心','17_数据接入与索引运维','18_评测与观测','19_权限与审计','20_项目设置'];document.querySelector('#g').innerHTML=files.map(f=>`<div class="card"><a href="screens/${f}.png" target="_blank"><img src="screens/${f}.png"></a><div class="cap"><b>${f.replace(/^\d+_/,'')}</b><a href="screens/${f}.png" target="_blank">查看原图</a></div></div>`).join('')</script></body></html>
